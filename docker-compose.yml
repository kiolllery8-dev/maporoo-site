services:
  maporoo:
    container_name: maporoo
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - auslife-web
    volumes:
      # 具名 volume，不是 ./data 這種 bind mount。
      #
      # 為什麼：容器以非 root 的 nextjs（uid 1001）執行。bind mount 的主機目錄
      # 由 Docker 以 root 建立，容器裡寫不進去，資料庫會開不了，全站 500。
      # 具名 volume 第一次掛載時會沿用 image 裡該目錄的擁有者（Dockerfile 已
      # chown 成 nextjs），權限自然正確。
      #
      # 備份資料庫：
      #   docker run --rm -v maporoo_data:/data -v "$PWD:/backup" alpine \
      #     tar czf /backup/maporoo-data-$(date +%F).tgz -C /data .
      - maporoo_data:/app/data
      - maporoo_uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      # 下面這些從專案目錄的 .env 帶進來（Docker Compose 會自動讀取它做變數展開）。
      # 刻意不用 env_file —— 那個指令在 .env 不存在時會讓容器直接起不來，
      # 等於用線上的站賭一個檔案有沒有放對。用 ${VAR:-} 的話，沒設就是空字串，
      # 站照常起得來，只是相關功能停用。
      - SITE_HOST=${SITE_HOST:-maporoo.com}
      - ADMIN_HOST=${ADMIN_HOST:-}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-manual}
      - BANK_NAME=${BANK_NAME:-}
      - BANK_ACCOUNT=${BANK_ACCOUNT:-}
      - BANK_HOLDER=${BANK_HOLDER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 沒有 ports —— 共用的 nginx 透過 auslife-web 網路反向代理進來。

volumes:
  maporoo_data:
  maporoo_uploads:

networks:
  auslife-web:
    external: true
