name: Reset admin password

# 後台開通／救援用的手動流程。
#
# 你在下面的表單填帳號與密碼，這個流程直接把它設進伺服器的資料庫。
# 系統不會自己產生密碼，密碼也不會出現在執行紀錄裡（送出後立刻遮蔽）。
#
# 用途：
#   ・第一次開通後台
#   ・忘記密碼、被鎖在外面
#   ・要換一組新的負責人帳號
#
# 只會動 admins 與該帳號的登入狀態。訂單、會員、商品、文章都在別的資料表，不受影響。

on:
  workflow_dispatch:
    inputs:
      username:
        description: "登入帳號（小寫英文、數字、- _ .）"
        required: true
        default: "maporooboss"
      password:
        description: "密碼（至少 8 碼，要有英文和數字）"
        required: true
      name:
        description: "顯示名稱"
        required: false
        default: "負責人"

concurrency:
  group: deploy-maporoo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: [self-hosted, maporoo]
    timeout-minutes: 10

    steps:
      - name: 設定帳號密碼
        env:
          MP_USERNAME: ${{ inputs.username }}
          MP_PASSWORD: ${{ inputs.password }}
          MP_NAME: ${{ inputs.name }}
        run: |
          set -e
          # 先把密碼加進遮蔽清單，之後任何一行 log 印到它都會變成 ***。
          echo "::add-mask::$MP_PASSWORD"

          docker exec \
            -e MP_USERNAME="$MP_USERNAME" \
            -e MP_PASSWORD="$MP_PASSWORD" \
            -e MP_NAME="$MP_NAME" \
            maporoo node -e '
              const crypto = require("node:crypto");
              const { DatabaseSync } = require("node:sqlite");

              const username = String(process.env.MP_USERNAME || "").trim().toLowerCase();
              const password = String(process.env.MP_PASSWORD || "");
              const name = String(process.env.MP_NAME || "負責人").trim();

              if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(username)) {
                console.error("帳號格式不對：只能用小寫英文、數字，以及 - _ .，長度 3–40，開頭要是英文或數字");
                process.exit(1);
              }
              if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                console.error("密碼不符規則：至少 8 碼，且要同時包含英文字母與數字");
                process.exit(1);
              }

              // 與 app/lib/auth.ts 相同的雜湊格式。
              const salt = crypto.randomBytes(16);
              const hash = crypto.scryptSync(password.normalize("NFKC"), salt, 64, {
                N: 16384, r: 8, p: 1, maxmem: 256 * 1024 * 1024,
              });
              const stored = ["scrypt", 16384, 8, 1, salt.toString("base64"), hash.toString("base64")].join("$");

              const db = new DatabaseSync("/app/data/maporoo.db");
              db.exec("PRAGMA foreign_keys = ON;");

              const existing = db.prepare("SELECT id FROM admins WHERE username = ?").get(username);
              if (existing) {
                db.prepare(
                  "UPDATE admins SET password_hash = ?, name = ?, role = 'owner', disabled = 0, must_change_password = 0 WHERE id = ?"
                ).run(stored, name, existing.id);
                db.prepare("DELETE FROM sessions WHERE scope = 'admin' AND subject_id = ?").run(existing.id);
                console.log("  已更新既有帳號的密碼：" + username);
              } else {
                db.prepare(
                  "INSERT INTO admins (username, email, password_hash, name, role, must_change_password) VALUES (?, ?, ?, ?, 'owner', 0)"
                ).run(username, username + "@no-email.local", stored, name);
                console.log("  已建立新的負責人帳號：" + username);
              }

              const rows = db.prepare("SELECT id, username, name, role, disabled FROM admins ORDER BY id").all();
              console.log("");
              console.log("  目前的管理者：");
              for (const r of rows) {
                console.log("   ", r.id, r.username, r.name, r.role, r.disabled ? "(已停用)" : "");
              }
            '

      - name: 完成
        run: |
          echo ""
          echo "  帳號：${{ inputs.username }}"
          echo "  密碼：你剛才填的那一組（不會顯示在這裡）"
          echo ""
          echo "  登入 https://maporoo.com/admin"
